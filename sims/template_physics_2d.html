<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mô Phỏng Vật Lí - Lớp Lý Thầy Ngọc</title>
  <style>
    :root {
      --bg: #101923;
      --panel: #192632;
      --text: #F0F4F8;
      --subtext: #94a3b8;
      --border: #2b3d4f;
      --accent: #4dabf7;
      --accent-hover: #339af0;
      --vector: #ff6b6b;
      --object: #ffd43b;
      --track: #4dabf7;
      --grid: rgba(255, 255, 255, 0.08);
      --card-bg: #131e2a;
    }
    body.light-theme {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1c3045;
      --subtext: #64748b;
      --border: #cbd5e1;
      --accent: #1766aa;
      --accent-hover: #1971c2;
      --vector: #e03131;
      --object: #f59f00;
      --track: #1766aa;
      --grid: rgba(0, 0, 0, 0.06);
      --card-bg: #f1f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }
    .brand-badge {
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(77, 171, 247, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--subtext);
    }
    .theme-toggle {
      cursor: pointer;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
    }
    main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #canvas_container {
      flex: 1;
      position: relative;
      background: var(--bg);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #sidebar {
      width: 250px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px;
      gap: 10px;
      font-size: 11.5px;
    }
    .control-group {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px;
    }
    .group-title {
      font-size: 10.5px;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .param-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
      gap: 2px;
    }
    .param-label {
      display: flex;
      justify-content: space-between;
      color: var(--text);
      font-size: 11px;
    }
    .param-val {
      font-weight: 700;
      color: var(--accent);
      font-family: monospace;
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-top: 4px;
    }
    button.btn-ctrl {
      background: #233546;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s;
    }
    button.btn-ctrl:hover { background: #2f455c; }
    button.btn-play { background: #2563eb; color: white; border-color: #3b82f6; }
    button.btn-play:hover { background: #1d4ed8; }
    button.btn-reset { background: #dc2626; color: white; border-color: #ef4444; }
    button.btn-reset:hover { background: #b91c1c; }
    .chk-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      cursor: pointer;
    }
    .hud-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(16, 25, 35, 0.85);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      color: #38bdf8;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 2px 10px;
      font-size: 9px;
      color: var(--subtext);
      display: flex;
      justify-content: space-between;
      height: 20px;
      align-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <span>LỚP LÝ THẦY NGỌC</span>
      <span class="brand-badge" id="lbl_grade">VẬT LÍ 10–11–12</span>
      <span style="color:var(--text); font-weight:normal;" id="lbl_sim_title">Template Mô Phỏng 2D</span>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="btn_theme">🌓 Đổi nền</button>
      <span>Bản quyền © Thầy Ngọc (0935.216.256)</span>
    </div>
  </header>

  <main>
    <div id="canvas_container">
      <canvas id="cv"></canvas>
      <div class="hud-overlay" id="hud_info">t = 0.00 s</div>
    </div>

    <div id="sidebar">
      <div class="control-group">
        <div class="group-title">Điều Khiển Thời Gian</div>
        <div class="btn-row">
          <button class="btn-ctrl btn-play" id="btn_play">▶ Phát</button>
          <button class="btn-ctrl btn-reset" id="btn_reset">↺ Đặt lại</button>
        </div>
        <div class="btn-row" style="margin-top:5px;">
          <button class="btn-ctrl" id="btn_step">⏯ Bước +</button>
          <select id="sel_speed" style="background:#233546; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px; font-size:10px;">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1.0" selected>1.0×</option>
            <option value="2.0">2.0×</option>
          </select>
        </div>
      </div>

      <div class="control-group" id="params_container">
        <div class="group-title">Tham Số Vật Lí</div>
        <!-- Điền các thanh trượt theo bài học -->
      </div>

      <div class="control-group">
        <div class="group-title">Tùy Chọn Hiển Thị</div>
        <label class="chk-row"><input type="checkbox" id="chk_vectors" checked> Hiện vectơ vận tốc/gia tốc</label>
        <label class="chk-row"><input type="checkbox" id="chk_trajectory" checked> Hiện quỹ đạo / đồ thị</label>
        <label class="chk-row"><input type="checkbox" id="chk_grid" checked> Hiện lưới tọa độ</label>
      </div>
    </div>
  </main>

  <footer>
    <span>Hệ thống Mô phỏng Vật lí GDPT 2018 - NKPdf V1.9</span>
    <span>Trạng thái: Hoạt động Offline 100% (60 FPS Clock)</span>
  </footer>

  <script>
    // CORE SIMULATION CLOCK & BASE TEMPLATE
    class SimulationClock {
      constructor() {
        this.simTime = 0.0;
        this.isRunning = false;
        this.timeScale = 1.0;
        this.lastWallTime = 0;
        this.animId = null;
        this.onTick = null;
      }
      start() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.lastWallTime = performance.now();
        const loop = (now) => {
          if (!this.isRunning) return;
          const dt = Math.min((now - this.lastWallTime) / 1000.0, 0.1);
          this.lastWallTime = now;
          this.simTime += dt * this.timeScale;
          if (this.onTick) this.onTick(this.simTime, dt);
          this.animId = requestAnimationFrame(loop);
        };
        this.animId = requestAnimationFrame(loop);
      }
      pause() {
        this.isRunning = false;
        if (this.animId) cancelAnimationFrame(this.animId);
      }
      reset() {
        this.pause();
        this.simTime = 0.0;
        if (this.onTick) this.onTick(0, 0);
      }
      step(dtStep = 0.05) {
        this.pause();
        this.simTime += dtStep * this.timeScale;
        if (this.onTick) this.onTick(this.simTime, dtStep);
      }
    }

    // Gắn bridge cho NKPdf
    window.simClock = new SimulationClock();
  </script>
</body>
</html>
